receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Only our explicitly instrumented business boundaries belong in LangSmith.
  # Fail closed on filter errors; the application itself remains fail-open.
  filter/agent_mcp_io:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch(name, "^(agent|mcp)[.]")'
        - 'attributes["travel.trace.has_input"] != true'
        - 'attributes["travel.trace.has_output"] != true'
        - 'not IsString(attributes["gen_ai.prompt.0.content"])'
        - 'not IsString(attributes["gen_ai.completion.0.content"])'
        - 'IsMatch(attributes["gen_ai.prompt.0.content"], "^[[:space:]]*$")'
        - 'IsMatch(attributes["gen_ai.completion.0.content"], "^[[:space:]]*$")'
  transform/business_metadata:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - 'delete_matching_keys(attributes, "^(http|url|net|network|server|client)[.]")'
          - 'delete_matching_keys(resource.attributes, "^(http|url|net|network|server|client)[.]")'
          # Prevent alternate instrumentation names from overriding agent names.
          - 'delete_key(attributes, "langsmith.trace.name")'
          - 'delete_key(attributes, "traceloop.entity.name")'
          - 'delete_key(attributes, "tool.name")'
  batch:

exporters:
  otlphttp/langsmith:
    # This value is already the complete signal URL. Using `endpoint` would
    # make the collector append another /v1/traces path.
    traces_endpoint: ${env:LANGSMITH_OTEL_ENDPOINT}
    headers:
      x-api-key: ${env:LANGSMITH_API_KEY}
      Langsmith-Project: ${env:LANGSMITH_PROJECT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/agent_mcp_io, transform/business_metadata, batch]
      exporters: [otlphttp/langsmith]
