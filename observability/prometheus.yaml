global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yaml

scrape_configs:
  - job_name: travel-operations
    static_configs:
      - targets: [operations-service:8012]

  - job_name: travel-agent-boundaries
    static_configs:
      - targets:
          - document-agent:8001
          - monitor-agent:8004
          - eval-agent:8005
          - notification-action-service:8008
          - flight-search-action-service:8010
