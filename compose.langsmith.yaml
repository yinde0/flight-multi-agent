services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command:
      - --config=/etc/otelcol/langsmith.yaml
    volumes:
      - ./otel-collector-langsmith.yaml:/etc/otelcol/langsmith.yaml:ro
    environment:
      MCP_OTEL_RELAY_ENDPOINT: http://travel-tools-mcp:8003/otel/v1/traces
      TRAVEL_TOOLS_TELEMETRY_TOKEN: ${TRAVEL_TOOLS_TELEMETRY_TOKEN:-local-telemetry-tools-token}
    expose:
      - "4318"
    networks:
      - travel-internal

  document-agent:
    environment:
      OTEL_TRACING_ENABLED: "true"
      OTEL_TRACE_SCOPE: "agents_mcp"
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"
      OTEL_HTTP_TRACE_MODE: "off"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CREWAI_OTEL_ENABLED: "false"
      TRACELOOP_TRACE_CONTENT: "false"
    depends_on:
      otel-collector:
        condition: service_started

  travel-api:
    environment:
      OTEL_TRACING_ENABLED: "true"
      OTEL_TRACE_SCOPE: "agents_mcp"
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"
      OTEL_HTTP_TRACE_MODE: "agent_roots"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      otel-collector:
        condition: service_started

  trip-orchestrator:
    environment:
      OTEL_TRACING_ENABLED: "true"
      OTEL_TRACE_SCOPE: "agents_mcp"
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"
      OTEL_HTTP_TRACE_MODE: "off"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      otel-collector:
        condition: service_started

  monitor-agent:
