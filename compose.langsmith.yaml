      OTEL_TRACING_ENABLED: "true"
      OTEL_TRACE_SCOPE: "agents_mcp"
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"
      OTEL_HTTP_TRACE_MODE: "off"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:?LANGSMITH_API_KEY is required}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-flight-multi-agent}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_OTEL_ENDPOINT: ${LANGSMITH_OTEL_ENDPOINT:-}
      TRAVEL_TOOLS_TELEMETRY_TOKEN: ${TRAVEL_TOOLS_TELEMETRY_TOKEN:-local-telemetry-tools-token}
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - travel-internal
      - tools-egress

  operations-service:
    environment:
      OTEL_TRACING_ENABLED: "true"
      OTEL_TRACE_SCOPE: "agents_mcp"
