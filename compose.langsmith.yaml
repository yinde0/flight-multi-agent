      OTEL_HTTP_TRACE_MODE: "off"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACELOOP_TRACE_CONTENT: "false"
    depends_on:
      otel-collector:
        condition: service_started

  eval-agent:
