x-backend-service: &backend-service
  image: ${BACKEND_IMAGE:-flight-multi-agent-backend:local}
  build:
    context: .
    dockerfile: Dockerfile.backend

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel-local}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - travel-internal

  minio:
    image: quay.io/minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-travel-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-travel-local-secret}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - travel-internal

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    # The official image runs as uid 1000, while a fresh named volume is
    # root-owned. Root is acceptable for this local emulator and lets SQLite
    # create its durable database file.
    user: root
    command:
      - -jar
      - DynamoDBLocal.jar
      - -sharedDb
      - -dbPath
      - ./data
      - -disableTelemetry
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    expose:
      - "8000"
    networks:
      - travel-internal

  nats:
    image: nats:2.11-alpine
    command:
      - -js
      - -m
      - "8222"
      - --store_dir
      - /data
    volumes:
      - nats-data:/data
    expose:
      - "4222"
      - "8222"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
    networks:
      - travel-internal

  travel-tools-mcp:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.travel_tools_mcp:app
      - --host
      - 0.0.0.0
      - --port
      - "8003"
    environment:
      TRAVEL_TOOLS_AUTH_ENABLED: "true"
      TRAVEL_TOOLS_MONITOR_TOKEN: ${TRAVEL_TOOLS_MONITOR_TOKEN:-local-monitor-tools-token}
      TRAVEL_TOOLS_SEARCH_TOKEN: ${TRAVEL_TOOLS_SEARCH_TOKEN:-local-search-tools-token}
      TRAVEL_TOOLS_NOTIFICATION_TOKEN: ${TRAVEL_TOOLS_NOTIFICATION_TOKEN:-local-notification-tools-token}
      FLIGHT_STATUS_PROVIDER: ${FLIGHT_STATUS_PROVIDER:-aviationstack}
      AviationStack_API_KEY: ${AviationStack_API_KEY:-}
      AVIATIONSTACK_BASE_URL: ${AVIATIONSTACK_BASE_URL:-https://api.aviationstack.com/v1}
      AVIATIONSTACK_TIMEOUT_SECONDS: ${AVIATIONSTACK_TIMEOUT_SECONDS:-30}
      AVIATIONSTACK_INCLUDE_FLIGHT_DATE_FILTER: ${AVIATIONSTACK_INCLUDE_FLIGHT_DATE_FILTER:-false}
      FLIGHT_STATUS_REPLAY_FIXTURE: /app/travel_eval/fixtures/monitoring/vertical_03_timeline.json
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-openweathermap}
      OpenWeatherMap_API_KEY: ${OpenWeatherMap_API_KEY:-}
      OPENWEATHER_BASE_URL: ${OPENWEATHER_BASE_URL:-https://api.openweathermap.org/data/2.5}
      OPENWEATHER_TIMEOUT_SECONDS: ${OPENWEATHER_TIMEOUT_SECONDS:-30}
      AIRPORT_COORDINATE_FIXTURE: /app/travel_eval/fixtures/airports.json
      WEATHER_REPLAY_FIXTURE: /app/travel_eval/fixtures/monitoring/vertical_03_weather_timeline.json
      FLIGHT_SEARCH_PROVIDER: ${FLIGHT_SEARCH_PROVIDER:-duffel}
      DUFFEL_TOKEN: ${DUFFEL_TOKEN:-}
      DUFFEL_BASE_URL: ${DUFFEL_BASE_URL:-https://api.duffel.com}
      DUFFEL_TIMEOUT_SECONDS: ${DUFFEL_TIMEOUT_SECONDS:-30}
      DUFFEL_SUPPLIER_TIMEOUT_MS: ${DUFFEL_SUPPLIER_TIMEOUT_MS:-10000}
      DUFFEL_MAX_OFFERS: ${DUFFEL_MAX_OFFERS:-100}
      FLIGHT_SEARCH_REPLAY_FIXTURE: /app/travel_eval/fixtures/search/vertical_06_options.json
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-recording}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_AUTH_KEY: ${TWILIO_AUTH_KEY:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_SMS_BODY_OVERRIDE: ${TWILIO_SMS_BODY_OVERRIDE:-}
      TWILIO_BASE_URL: ${TWILIO_BASE_URL:-https://api.twilio.com/2010-04-01}
      TWILIO_TIMEOUT_SECONDS: ${TWILIO_TIMEOUT_SECONDS:-30}
    expose:
      - "8003"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal
      - tools-egress

  eval-agent:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.eval_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8005"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      MONITORING_TABLE_NAME: travel-monitoring-state
      NATS_URL: nats://nats:4222
      SUPPRESSION_POLICY_PATH: /app/travel_eval/policies/suppression_policy.v1.json
      EVAL_REASONING_MODE: ${EVAL_REASONING_MODE:-off}
      EVAL_REASONING_MODEL: ${EVAL_REASONING_MODEL:-mistral/mistral-small-latest}
      EVAL_REASONING_PROMPT_PATH: /app/travel_eval/prompts/eval_advisory.v1.md
      EVAL_REASONING_TIMEOUT_SECONDS: ${EVAL_REASONING_TIMEOUT_SECONDS:-45}
      EVAL_REASONING_MAX_TOKENS: ${EVAL_REASONING_MAX_TOKENS:-700}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_DISABLE_TRACKING: "true"
      CREWAI_DISABLE_VERSION_CHECK: "true"
    depends_on:
      dynamodb-local:
        condition: service_started
      nats:
        condition: service_healthy
    expose:
      - "8005"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal

  operations-service:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.operations_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8012"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      MONITORING_TABLE_NAME: travel-monitoring-state
      NATS_URL: nats://nats:4222
      # No fallback credential: operator endpoints remain disabled until an
      # explicit secret is injected. Health and Prometheus metrics stay public
      # only on the private Docker network.
      OPS_API_TOKEN: ${OPS_API_TOKEN:-}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      TRACELOOP_TRACE_CONTENT: "false"
    depends_on:
      dynamodb-local:
        condition: service_started
      nats:
        condition: service_healthy
    expose:
      - "8012"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal

  notification-webhook-service:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.notification_webhook:app
      - --host
      - 0.0.0.0
      - --port
      - "8014"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      MONITORING_TABLE_NAME: travel-monitoring-state
      TWILIO_WEBHOOK_ENABLED: ${TWILIO_WEBHOOK_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_AUTH_KEY: ${TWILIO_AUTH_KEY:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      NOTIFICATION_WEBHOOK_TEST_API_ENABLED: "false"
    depends_on:
      dynamodb-local:
        condition: service_started
    expose:
      - "8014"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal
      - tools-egress

  notification-action-service:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.notification_action_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8008"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      MONITORING_TABLE_NAME: travel-monitoring-state
      NATS_URL: nats://nats:4222
      TRAVEL_TOOLS_MCP_URL: http://travel-tools-mcp:8003/mcp
      TRAVEL_TOOLS_NOTIFICATION_TOKEN: ${TRAVEL_TOOLS_NOTIFICATION_TOKEN:-local-notification-tools-token}
      COMMUNICATION_AGENT_URL: http://communication-agent:8017
      COMMUNICATION_AGENT_TIMEOUT_SECONDS: ${COMMUNICATION_AGENT_TIMEOUT_SECONDS:-35}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-recording}
      TRIP_ORCHESTRATOR_URL: http://trip-orchestrator:8011
      NO_PROXY: travel-tools-mcp,communication-agent,trip-orchestrator,dynamodb-local,nats,localhost,127.0.0.1
    depends_on:
      dynamodb-local:
        condition: service_started
      eval-agent:
        condition: service_healthy
      nats:
        condition: service_healthy
      travel-tools-mcp:
        condition: service_healthy
      communication-agent:
        condition: service_healthy
    expose:
      - "8008"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal

  communication-agent:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.communication_a2a:app
      - --host
      - 0.0.0.0
      - --port
      - "8017"
    environment:
      COMMUNICATION_AGENT_PUBLIC_URL: http://communication-agent:8017
      DISRUPTION_EXPLANATION_MODE: ${DISRUPTION_EXPLANATION_MODE:-auto}
      DISRUPTION_EXPLANATION_TIMEOUT_SECONDS: ${DISRUPTION_EXPLANATION_TIMEOUT_SECONDS:-30}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-${AZURE_ENDPOINT:-}}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-${AZURE_API_KEY:-}}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-${CHAT_DEPLOYMENT:-}}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-${CHAT_API_VERSION:-2024-10-21}}
      NO_PROXY: communication-agent,localhost,127.0.0.1
    expose:
      - "8017"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8017/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal
      - communication-egress

  flight-search-action-service:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.flight_search_action_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      MONITORING_TABLE_NAME: travel-monitoring-state
      NATS_URL: nats://nats:4222
      TRAVEL_TOOLS_MCP_URL: http://travel-tools-mcp:8003/mcp
      TRAVEL_TOOLS_SEARCH_TOKEN: ${TRAVEL_TOOLS_SEARCH_TOKEN:-local-search-tools-token}
      NO_PROXY: travel-tools-mcp,dynamodb-local,nats,localhost,127.0.0.1
    depends_on:
      dynamodb-local:
        condition: service_started
      eval-agent:
        condition: service_healthy
      travel-tools-mcp:
        condition: service_healthy
      nats:
        condition: service_healthy
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal

  monitor-agent:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.monitoring_a2a:app
      - --host
      - 0.0.0.0
      - --port
      - "8004"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      MONITORING_TABLE_NAME: travel-monitoring-state
      TRAVEL_TOOLS_MCP_URL: http://travel-tools-mcp:8003/mcp
      TRAVEL_TOOLS_MONITOR_TOKEN: ${TRAVEL_TOOLS_MONITOR_TOKEN:-local-monitor-tools-token}
      MONITOR_AGENT_PUBLIC_URL: http://monitor-agent:8004
      NATS_URL: nats://nats:4222
      NO_PROXY: travel-tools-mcp,dynamodb-local,nats,monitor-agent,localhost,127.0.0.1
    depends_on:
      dynamodb-local:
        condition: service_started
      eval-agent:
        condition: service_healthy
      notification-action-service:
        condition: service_healthy
      flight-search-action-service:
        condition: service_healthy
      travel-tools-mcp:
        condition: service_healthy
      nats:
        condition: service_healthy
    expose:
      - "8004"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal

  document-agent:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.a2a_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_TESTING: "true"
      DOCUMENT_AGENT_PUBLIC_URL: http://document-agent:8001
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_BASE_URL: ${MISTRAL_OCR_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      MISTRAL_OCR_TIMEOUT_SECONDS: ${MISTRAL_OCR_TIMEOUT_SECONDS:-60}
      DOCUMENT_LLM_MODE: ${DOCUMENT_LLM_MODE:-off}
      DOCUMENT_LLM_MIN_CONFIDENCE: ${DOCUMENT_LLM_MIN_CONFIDENCE:-0.90}
      DOCUMENT_LLM_MAX_INPUT_CHARS: ${DOCUMENT_LLM_MAX_INPUT_CHARS:-30000}
      DOCUMENT_LLM_TIMEOUT_SECONDS: ${DOCUMENT_LLM_TIMEOUT_SECONDS:-45}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-${AZURE_ENDPOINT:-}}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-${AZURE_API_KEY:-}}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-${CHAT_DEPLOYMENT:-}}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-${CHAT_API_VERSION:-2024-10-21}}
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal
      - document-egress

  trip-orchestrator:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.trip_orchestrator:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel-local}@postgres:5432/${POSTGRES_DB:-travel}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-travel-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-travel-local-secret}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      S3_ENDPOINT_URL: http://minio:9000
      ITINERARY_BUCKET_NAME: ${ITINERARY_BUCKET_NAME:-travel-itineraries}
      DOCUMENT_AGENT_URL: http://document-agent:8001
      MONITOR_AGENT_URL: http://monitor-agent:8004
      SCHEDULER_BACKGROUND_ENABLED: ${SCHEDULER_BACKGROUND_ENABLED:-true}
      SCHEDULER_CONTROL_ENABLED: ${SCHEDULER_CONTROL_ENABLED:-false}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-30}
      SCHEDULER_LEASE_SECONDS: ${SCHEDULER_LEASE_SECONDS:-120}
      NO_PROXY: document-agent,monitor-agent,postgres,minio,localhost,127.0.0.1
    depends_on:
      document-agent:
        condition: service_healthy
      minio:
        condition: service_healthy
      monitor-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "8011"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - travel-internal

  travel-api:
    <<: *backend-service
    command:
      - uvicorn
      - flight_agent.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DOCUMENT_AGENT_URL: http://document-agent:8001
      MONITOR_AGENT_URL: http://monitor-agent:8004
      TRIP_ORCHESTRATOR_URL: http://trip-orchestrator:8011
      SCHEDULER_CONTROL_ENABLED: ${SCHEDULER_CONTROL_ENABLED:-false}
      NO_PROXY: document-agent,monitor-agent,trip-orchestrator,localhost,127.0.0.1
    depends_on:
      document-agent:
        condition: service_healthy
      monitor-agent:
        condition: service_healthy
      trip-orchestrator:
        condition: service_healthy
    ports:
      - "8080:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - travel-internal
      - travel-edge

  traveler-ui:
    image: ${FRONTEND_IMAGE:-flight-multi-agent-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      TRAVEL_API_URL: http://travel-api:8000
      TRAVEL_UI_API_TIMEOUT_SECONDS: ${TRAVEL_UI_API_TIMEOUT_SECONDS:-150}
      NO_PROXY: travel-api,localhost,127.0.0.1
    depends_on:
      travel-api:
        condition: service_healthy
    ports:
      - "${TRAVEL_UI_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - travel-internal
      - travel-edge

networks:
  travel-internal:
    internal: true
  travel-edge:
  document-egress:
  tools-egress:
  communication-egress:

volumes:
  dynamodb-data:
  minio-data:
  nats-data:
  postgres-data:
