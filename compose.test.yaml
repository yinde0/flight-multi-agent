services:
  mistral-ocr-stub:
    image: ${BACKEND_IMAGE:-flight-multi-agent-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    command:
      - uvicorn
      - flight_agent.mistral_ocr_stub:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    expose:
      - "8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - travel-internal

  document-agent:
    environment:
      MISTRAL_API_KEY: local-mistral-test-key
      MISTRAL_OCR_BASE_URL: http://mistral-ocr-stub:8002/v1
      MISTRAL_OCR_MODEL: mistral-ocr-latest
      NO_PROXY: mistral-ocr-stub,document-agent,localhost,127.0.0.1
    depends_on:
      mistral-ocr-stub:
        condition: service_healthy

  travel-tools-mcp:
    environment:
      FLIGHT_STATUS_PROVIDER: replay
      AviationStack_API_KEY: local-unused
      FLIGHT_STATUS_REPLAY_FIXTURE: /app/travel_eval/fixtures/monitoring/vertical_03_timeline.json
      WEATHER_PROVIDER: replay
      OpenWeatherMap_API_KEY: local-unused
      WEATHER_REPLAY_FIXTURE: /app/travel_eval/fixtures/monitoring/vertical_03_weather_timeline.json
      # Golden tests must never contact a real notification provider, even when a
      # developer's local .env enables Twilio.
      NOTIFICATION_PROVIDER: recording

  notification-action-service:
    environment:
      NOTIFICATION_PROVIDER: recording

  notification-webhook-service:
    environment:
      TWILIO_WEBHOOK_ENABLED: "false"
      NOTIFICATION_WEBHOOK_TEST_API_ENABLED: "false"
